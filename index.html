<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MIYRAS PRO · Pro generator</title>

    <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.5.1/dist/bwip-js-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.1s;
        }

        :root {
            --bg: #f6f9fc;
            --card: #ffffff;
            --text: #1a2b3c;
            --border: #e2e8f0;
            --primary: #0b5e7c;
            --primary-light: #1e7a9c;
            --secondary: #64748b;
            --accent: #2d9cdb;
            --shadow: 0 8px 20px rgba(0,20,30,0.08);
            --qr-bg: #ffffff;
            --placeholder: #94a3b8;
            --card-radius: 28px;
        }

        body.dark {
            --bg: #121826;
            --card: #1e2638;
            --text: #e9edf5;
            --border: #2f3a54;
            --primary: #2f80ed;
            --primary-light: #4791e8;
            --secondary: #9aa8c2;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --qr-bg: #1e2638;
            --placeholder: #596580;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 1100px;
            width: 100%;
        }

        .header-card {
            background: var(--card);
            border-radius: var(--card-radius);
            padding: 1.8rem 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 i { color: var(--primary); }

        .badge {
            background: var(--primary-light);
            color: white;
            font-size: 0.9rem;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            margin-left: 8px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 1.5rem 0 0.8rem;
            align-items: center;
            justify-content: space-between;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.7rem 1.4rem;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
            background: var(--card);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 6px 14px rgba(15, 100, 140, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary-light);
            background: var(--primary-light);
            color: white;
        }

        textarea {
            width: 100%;
            padding: 1.5rem;
            border-radius: 32px;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            margin: 20px 0 12px;
            outline: none;
        }

        textarea:focus { border-color: var(--primary); }

        .progress-container {
            background: var(--border);
            border-radius: 60px;
            height: 10px;
            width: 100%;
            margin: 16px 0 6px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 10px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            border-radius: 60px;
            transition: width 0.1s linear;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: var(--secondary);
            margin: 5px 0 10px;
        }

        /* VIEWER */
        .single-view {
            background: var(--card);
            border-radius: 34px;
            padding: 2rem 2rem 1.8rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .content-area {
            min-height: 470px;
        }

        .qr-wrapper {
            background: var(--qr-bg);
            padding: 1.2rem;
            border-radius: 36px;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 1.2rem;
        }

        .qr-wrapper img {
            width: min(320px, 75vw);
            height: auto;
            aspect-ratio: 1/1;
            display: block;
            border-radius: 24px;
        }

        .qr-text-label {
            font-size: 1.1rem;
            font-weight: 600;
            word-break: break-word;
            max-width: 95%;
            background: var(--bg);
            padding: 0.9rem 1.8rem;
            border-radius: 60px;
            border: 1px dashed var(--border);
            color: var(--primary-light);
            margin: 10px auto 0;
        }

        .index-indicator {
            margin-top: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--secondary);
        }

        /* NAV FIXED */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
        }

        .nav-btn {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            border: 2px solid var(--border);
            background: var(--card);
            cursor: pointer;
            font-size: 1.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            transition: 0.2s;
            user-select: none;
        }

        .nav-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary-light);
            color: white;
            transform: translateY(-3px);
        }

        /* ONLY CONTENT SLIDE */
        .slide-right { animation: slideRight 0.25s ease; }
        .slide-left  { animation: slideLeft 0.25s ease; }

        @keyframes slideRight {
            from { opacity: 0; transform: translateX(40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .placeholder-info {
            background: var(--card);
            border-radius: 40px;
            padding: 4rem 2rem;
            text-align: center;
            border: 2px dashed var(--border);
            color: var(--placeholder);
        }

        @media (max-width: 600px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: center; }
            h1 { font-size: 1.6rem; }
            .single-view { padding: 1.5rem 1rem; }
            .nav-btn { width: 62px; height: 62px; font-size: 1.5rem; }
            .content-area { min-height: 420px; }
        }

        footer {
            margin-top: 1rem;
            opacity: 0.6;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header-card">
        <h1>
            <i class="fas fa-qrcode"></i> MIYRAS
            <span class="badge"><span id="validCount">0</span> valid</span>
        </h1>

        <div class="toolbar">
            <div class="btn-group">
                <button class="btn" id="uploadBtn"><i class="fas fa-upload"></i> TXT</button>
                <button class="btn" id="generateBtn"><i class="fas fa-play"></i> Generate</button>
                <button class="btn" id="clearBtn"><i class="fas fa-eraser"></i> Clear</button>
                <button class="btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button class="btn" id="darkToggle"><i class="fas fa-moon"></i> Dark</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="downloadZipBtn"><i class="fas fa-file-archive"></i> Download ZIP</button>
            </div>
        </div>

        <textarea id="inputTextarea" rows="6" placeholder="Paste multiple lines — each line with 5+ characters becomes a DataMatrix code. Only first number/word is used..."></textarea>

        <div class="progress-container" id="progressContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="stats">
            <span>Total lines: <span id="totalLines">0</span></span>
            <span>Eligible (≥5): <span id="eligibleLines">0</span></span>
        </div>
    </div>

    <div id="qrViewer"></div>

    <footer class="small-note">
        <i class="fas fa-shield-alt"></i> DataMatrix · FAST mode
    </footer>
</div>

<input type="file" id="fileInput" accept=".txt, text/plain" style="display:none;">

<script>
(function() {
    const textarea = document.getElementById('inputTextarea');
    const validSpan = document.getElementById('validCount');
    const totalLinesSpan = document.getElementById('totalLines');
    const eligibleSpan = document.getElementById('eligibleLines');
    const generateBtn = document.getElementById('generateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const darkToggle = document.getElementById('darkToggle');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const downloadZipBtn = document.getElementById('downloadZipBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const qrViewer = document.getElementById('qrViewer');

    let currentValidQRCodes = [];
    let currentIndex = 0;
    let isGenerating = false;

    function extractFirstToken(line) {
        const trimmed = line.trim();
        if (!trimmed) return '';
        return trimmed.split(/\s+/)[0] || '';
    }

    function updateCounts() {
        const lines = textarea.value.split(/\r?\n/);
        totalLinesSpan.innerText = lines.length;
        eligibleSpan.innerText = lines.map(extractFirstToken).filter(t => t.length >= 5).length;
    }

    textarea.addEventListener('input', updateCounts);
    updateCounts();

    darkToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        darkToggle.innerHTML = document.body.classList.contains('dark')
            ? '<i class="fas fa-sun"></i> Light'
            : '<i class="fas fa-moon"></i> Dark';
    });

    clearBtn.addEventListener('click', () => {
        textarea.value = '';
        currentValidQRCodes = [];
        currentIndex = 0;
        updateCounts();
        renderViewer();
    });

    refreshBtn.addEventListener('click', () => location.reload());

    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            textarea.value = ev.target.result;
            updateCounts();
            fileInput.value = '';
        };
        reader.readAsText(file);
    });

    function escapeHtml(unsafe) {
        return unsafe.replace(/[&<>"']/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            if(m === '"') return '&quot;';
            return '&#039;';
        });
    }

    function renderViewer(animationClass = '') {
        if (currentValidQRCodes.length === 0) {
            qrViewer.innerHTML = `
                <div class="placeholder-info">
                    <i class="fas fa-smile-wink" style="font-size:2.5rem; opacity:0.5; margin-bottom:1rem;"></i>
                    <br>No codes yet. Paste text and click Generate.
                </div>
            `;
            validSpan.innerText = "0";
            return;
        }

        const item = currentValidQRCodes[currentIndex];

        qrViewer.innerHTML = `
            <div class="single-view">
                <div class="content-area ${animationClass}" id="contentArea">
                    <div class="qr-wrapper">
                        <img src="${item.dataUrl}" alt="DataMatrix" loading="lazy">
                    </div>

                    <div class="qr-text-label">${escapeHtml(item.text)}</div>

                    <div class="index-indicator">
                        ${currentIndex + 1} / ${currentValidQRCodes.length}
                    </div>
                </div>

                <div class="nav-buttons">
                    <div class="nav-btn" id="prevBtn"><i class="fas fa-chevron-up"></i></div>
                    <div class="nav-btn" id="nextBtn"><i class="fas fa-chevron-down"></i></div>
                </div>
            </div>
        `;

        validSpan.innerText = currentValidQRCodes.length;

        document.getElementById('prevBtn').onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderViewer('slide-left');
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            if (currentIndex < currentValidQRCodes.length - 1) {
                currentIndex++;
                renderViewer('slide-right');
            }
        };
    }

    function generateDataMatrixDataURL(text) {
        return new Promise((resolve, reject) => {
            try {
                const canvas = document.createElement('canvas');
                bwipjs.toCanvas(canvas, {
                    bcid: 'datamatrix',
                    text: text,
                    scale: 5, // TEZROQ
                    includetext: false,
                    padding: 6,
                    backgroundcolor: 'FFFFFF'
                });
                resolve(canvas.toDataURL('image/png'));
            } catch (e) {
                reject(e);
            }
        });
    }

    async function generateBatch(validTexts, batchSize = 30) {
        currentValidQRCodes = [];
        progressContainer.style.display = 'block';
        progressFill.style.width = '0%';

        const total = validTexts.length;

        for (let i = 0; i < total; i += batchSize) {
            const batch = validTexts.slice(i, i + batchSize);

            const results = await Promise.all(batch.map(async (text) => {
                try {
                    const dataUrl = await generateDataMatrixDataURL(text);
                    return { text, dataUrl };
                } catch {
                    return null;
                }
            }));

            currentValidQRCodes.push(...results.filter(x => x !== null));
            progressFill.style.width = `${(currentValidQRCodes.length / total) * 100}%`;
        }

        progressContainer.style.display = 'none';
    }

    generateBtn.addEventListener('click', async () => {
        if (isGenerating) return;

        const lines = textarea.value.split(/\r?\n/);
        const validTexts = lines.map(extractFirstToken).filter(t => t.length >= 5);

        if (validTexts.length === 0) {
            alert("No lines with 5+ characters.");
            return;
        }

        isGenerating = true;
        qrViewer.innerHTML = `<div class="placeholder-info"><i class="fas fa-spinner fa-pulse"></i><br>FAST generating...</div>`;

        await generateBatch(validTexts, 40);

        currentIndex = 0;
        renderViewer('slide-right');
        isGenerating = false;
    });

    downloadZipBtn.addEventListener('click', async () => {
        if (currentValidQRCodes.length === 0) {
            alert("No codes generated.");
            return;
        }

        const zip = new JSZip();
        const folder = zip.folder("datamatrix_codes");

        progressContainer.style.display = 'block';
        progressFill.style.width = '0%';

        let processed = 0;
        const total = currentValidQRCodes.length;

        for (const item of currentValidQRCodes) {
            let filename = item.text.trim().replace(/[^a-z0-9_\-\.\u4e00-\u9fa5]/gi, '_');
            if (!filename) filename = "datamatrix";

            const blob = await (await fetch(item.dataUrl)).blob();
            folder.file(filename + ".png", blob);

            processed++;
            progressFill.style.width = `${(processed / total) * 100}%`;
        }

        const content = await zip.generateAsync({ type: "blob" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(content);
        link.download = "datamatrix_bulk.zip";
        link.click();
        URL.revokeObjectURL(link.href);

        progressContainer.style.display = 'none';
    });

    renderViewer();
})();
</script>
</body>
</html>
